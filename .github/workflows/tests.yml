name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # REV2 queue (INIT-24): fail the run if a vendored rotation_core module drifts from
      # the tsachev-ops canon. sync_rotation_core.py --check can't run in CI (the canon lives
      # in the private vault, not this repo), so the pinned git blob id IS the canon's identity.
      # The blob id is the identity of the COMMITTED bytes (git rev-parse HEAD:path), immune to
      # line endings and checkout -- a working-tree sha256 was flaky (CRLF vs LF blob mismatch).
      # On a legit core change: run sync_rotation_core.py, then update the blob id here in the
      # SAME commit that ships the new src/ module (the existing sync ritual, one extra line).
      - name: Check vendored rotation_core parity (REV2)
        run: |
          declare -A EXPECT=(
            [prices.py]=2e4c5e4c3015
            [rank_history.py]=67be7a1eeb09
            [signal_engine.py]=b9bbb9bc5b48
            [sector_engine.py]=0d63c27900d4
            [screener_core.py]=9e05bad72028
          )
          rc=0
          for m in "${!EXPECT[@]}"; do
            got=$(git rev-parse "HEAD:src/$m" | cut -c1-12)
            if [ "$got" != "${EXPECT[$m]}" ]; then
              echo "DRIFT src/$m: got $got expected ${EXPECT[$m]}"; rc=1
            else
              echo "OK    src/$m $got"
            fi
          done
          [ $rc -eq 0 ] && echo "PASS -- rotation_core in sync with canon" || \
            { echo "FAIL -- run sync_rotation_core.py + update the pinned blob id in tests.yml"; exit 1; }

      - name: Run tests
        # python -m pytest puts the repo root on sys.path → `from src...` resolves
        run: python -m pytest -q
