name: Daily Rotation Radar Update

on:
  schedule:
    - cron: "0 22 * * 1-5"  # 22:00 UTC всеки delnik (~17:00 ET след US close)
  workflow_dispatch:        # ръчен trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # INIT-22 P9 strangler. Set BOTH repo secrets to source STOXX600 prices from the canonical
      # price-archive base (mechanism = checkout via read PAT, mirror of P6 ETF-rr):
      #   DATACORE_RO_PAT       -> data-core (private)     : the P1 reader datacore.archive
      #   PRICE_ARCHIVE_RO_PAT  -> price-archive (private) : the canonical daily bars (the data)
      # ABSENT (either) -> the base checkouts are skipped and scripts/daily_update.py falls back to
      # its OLD yfinance download_prices (production unchanged -- the radar never stops).
      # collectors is PUBLIC (the reader collectors/price/consumer.py) -> no token.
      DATACORE_RO_PAT: ${{ secrets.DATACORE_RO_PAT }}
      PRICE_ARCHIVE_RO_PAT: ${{ secrets.PRICE_ARCHIVE_RO_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # P9: widened for the rebase-before-push window

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- P9: canonical prices come FROM the price-archive base; only when BOTH PATs are set ----
      - name: Checkout data-core (P1 reader, read-only)
        if: ${{ env.DATACORE_RO_PAT != '' && env.PRICE_ARCHIVE_RO_PAT != '' }}
        uses: actions/checkout@v4
        with:
          repository: tsvetoslavtsachev/data-core
          token: ${{ env.DATACORE_RO_PAT }}   # Contents=READ only -- cannot corrupt canon
          path: .data-core
          fetch-depth: 1
      - name: Checkout price-archive (canonical daily bars, read-only)
        if: ${{ env.DATACORE_RO_PAT != '' && env.PRICE_ARCHIVE_RO_PAT != '' }}
        uses: actions/checkout@v4
        with:
          repository: tsvetoslavtsachev/price-archive
          token: ${{ env.PRICE_ARCHIVE_RO_PAT }}   # Contents=READ only
          path: .price-archive
          fetch-depth: 1
      - name: Checkout collectors (public, the price reader)
        if: ${{ env.DATACORE_RO_PAT != '' && env.PRICE_ARCHIVE_RO_PAT != '' }}
        uses: actions/checkout@v4
        with:
          repository: tsvetoslavtsachev/collectors
          path: .collectors
          fetch-depth: 1

      - name: Run daily update (base-first canonical prices; yfinance CLOSED fallback)
        env:
          # When the base checkouts ran, the consumer reads canon from .price-archive via the P1
          # reader on PYTHONPATH; otherwise these point at absent dirs, the import fails, and
          # daily_update.py transparently uses the OLD yfinance fetch (CLOSED fallback).
          DATACORE_ROOT: ${{ github.workspace }}/.price-archive
          PYTHONPATH: ${{ github.workspace }}/.data-core:${{ github.workspace }}/.collectors
        run: python scripts/daily_update.py

      # P9 guard: with the PATs set, base sourcing is INTENDED -- fail RED (before any commit) on a
      # silent mass-fallback to yfinance (coverage floor + allow-list; no benchmark cache here).
      - name: Assert base-sourced (no silent yfinance fallback)
        if: ${{ env.DATACORE_RO_PAT != '' && env.PRICE_ARCHIVE_RO_PAT != '' }}
        run: python scripts/assert_base_sourced.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "daily: update ranks history & dashboard data"
            # Retry push с rebase за защита срещу concurrent push race
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Push успешен (опит $attempt)."
                exit 0
              fi
              echo "Push fail-на (опит $attempt) — rebase + retry..."
              # -X theirs: двата run-а пренаписват целия data.json, затова rebase винаги конфликтва;
              # нашата свежа регенерация е авторитетна -> реши конфликта към нас, не гърми червено.
              git pull --rebase -X theirs origin main
              sleep $((attempt * 5))
            done
            echo "Push fail-на 5 пъти — abort."
            exit 1
          fi
